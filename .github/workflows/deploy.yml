name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # The gate: identical to ci.yml so a red suite never deploys.
  check:
    name: gofmt · vet · lint · test
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.4
        ports: ["8402:8000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14
      - run: go test -race ./...
      - run: cd client && go vet ./... && go test -race ./...
      - run: go test -race -run TestDynamoLocal ./internal/store/
        env:
          AUTH_TEST_DYNAMO_ENDPOINT: http://localhost:8402

  deploy:
    name: sam deploy (prod)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: sam build
        run: sam build --template infra/template.yaml
        env:
          VERSION: ${{ github.sha }}
      - name: sam deploy
        env:
          DOMAIN: ${{ vars.AUTH_DOMAIN_NAME }}
          CERT: ${{ vars.AUTH_CERTIFICATE_ARN }}
          GOOGLE_CLIENT_ID: ${{ vars.AUTH_GOOGLE_CLIENT_ID }}
        run: |
          # Custom domain only when both repo variables are set; SAM rejects empty overrides.
          PARAMS=()
          if [ -n "$DOMAIN" ] && [ -n "$CERT" ]; then
            # The issuer follows the domain: CloudFormation keeps a parameter's previous
            # value across deploys, so a changed template default alone never lands.
            PARAMS+=("DomainName=$DOMAIN" "CertificateArn=$CERT" "Issuer=https://$DOMAIN")
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            PARAMS+=("GoogleClientID=$GOOGLE_CLIENT_ID")
          fi
          OVERRIDES=()
          if [ ${#PARAMS[@]} -gt 0 ]; then OVERRIDES=(--parameter-overrides "${PARAMS[@]}"); fi
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset "${OVERRIDES[@]}"
      - name: smoke test
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name auth-service-prod \
                --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "API: $URL"
          curl -fsS "$URL/health" | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS "$URL/.well-known/jwks.json" | grep -q '"kty":"EC"'
