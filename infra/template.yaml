AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  auth-service: auth as a service for Nathan's products. HTTP API -> Lambda -> DynamoDB,
  KMS signing keys, SQS worker. See docs/DESIGN.md.

Parameters:
  Issuer:
    Type: String
    Default: https://auth.nathanblatter.com
    Description: Public base URL, also the JWT iss claim.
  DomainName:
    Type: String
    Default: ""
    Description: Custom domain (auth.nathanblatter.com). Empty = execute-api URL only.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate for DomainName, same region as the API.
  AdminTokenHashParam:
    Type: String
    Default: /auth-service/prod/admin-token-hash
    Description: SSM parameter holding the hex SHA-256 of the interim admin token.
  GoogleClientID:
    Type: String
    Default: ""
    Description: Google OAuth client id for Sign in with Google (empty = disabled).
  GoogleClientSecretParam:
    Type: String
    Default: /auth-service/prod/google-client-secret
    Description: SSM SecureString holding the Google OAuth client secret.

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [arm64]
    Handler: bootstrap
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO

Resources:
  # ── storage ──────────────────────────────────────────────────────────────
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── signing keys ─────────────────────────────────────────────────────────
  # Rotation: add SigningKeyB, put it FIRST in AUTH_SIGNING_KEY_IDS, deploy;
  # remove A once every token it signed has expired. See docs/DESIGN.md.
  SigningKeyA:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: auth-service JWT signing key A (ES256)
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: kms:*
            Resource: "*"
  SigningKeyAAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-signing-a
      TargetKeyId: !Ref SigningKeyA

  # ── background jobs ──────────────────────────────────────────────────────
  JobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-jobs
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt JobDeadLetterQueue.Arn
        maxReceiveCount: 5
  JobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-jobs-dlq
      MessageRetentionPeriod: 1209600

  # ── API ──────────────────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Bill protection, not brute-force protection (that is per-IP, slice 2).
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latency":"$context.responseLatency","ua":"$context.identity.userAgent"}'
  # Custom domain, only when both params are set. DNS lives in Cloudflare:
  # CNAME DomainName -> CustomDomainTarget output, proxy off.
  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2
  ApiDomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasDomain
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomain
      Stage: $default
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      CodeUri: ..
      Description: auth-service HTTP API
      Environment:
        Variables:
          AUTH_ISSUER: !Ref Issuer
          AUTH_TABLE: !Ref Table
          AUTH_SIGNING_KEY_IDS: !Ref SigningKeyA
          AUTH_ADMIN_TOKEN_HASH_PARAM: !Ref AdminTokenHashParam
          AUTH_GOOGLE_CLIENT_ID: !Ref GoogleClientID
          AUTH_GOOGLE_CLIENT_SECRET_PARAM: !Ref GoogleClientSecretParam
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - SQSSendMessagePolicy:
            QueueName: !GetAtt JobQueue.QueueName
        - Statement:
            - Effect: Allow
              Action: [kms:Sign, kms:GetPublicKey]
              Resource: !GetAtt SigningKeyA.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminTokenHashParam}
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleClientSecretParam}
  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 30

  WorkerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Sub ${AWS::StackName}-worker
      CodeUri: ..
      Description: auth-service background jobs
      Timeout: 30
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
  WorkerFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-worker
      RetentionInDays: 30

  # ── alarms ───────────────────────────────────────────────────────────────
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-5xx
      AlarmDescription: auth-service API returning 5xx
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - { Name: ApiId, Value: !Ref HttpApi }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-jobs-dlq
      AlarmDescription: background jobs landing in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt JobDeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: execute-api URL (always works, even without the custom domain)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  CustomDomainTarget:
    Condition: HasDomain
    Description: CNAME target for DomainName in Cloudflare (DNS only, grey cloud)
    Value: !GetAtt ApiDomain.RegionalDomainName
  SigningKeyAId:
    Value: !Ref SigningKeyA
  TableName:
    Value: !Ref Table
  JobQueueUrl:
    Value: !Ref JobQueue
